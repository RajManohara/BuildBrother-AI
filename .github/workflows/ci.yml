name: BuildBrother checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: buildbrother_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: buildbrother_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buildbrother_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://buildbrother_test:ci-test-only@localhost:5432/buildbrother_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
