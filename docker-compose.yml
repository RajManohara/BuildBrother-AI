name: buildbrother-ai
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildbrother}
      POSTGRES_USER: ${POSTGRES_USER:-buildbrother}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the local setup script first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-buildbrother}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-buildbrother}
      DEMO_MODE: ${DEMO_MODE:-true}
      APP_API_KEY: ${APP_API_KEY:?Run the local setup script first}
      INGEST_TOKEN: ${INGEST_TOKEN:?Run the local setup script first}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-0}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-RajManohara/BuildBrother-AI}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2026-03-10}
      COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-300}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      APP_API_KEY: ${APP_API_KEY}
      INGEST_TOKEN: ${INGEST_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  collector:
    build: ./backend
    profiles: [github]
    command: ["python", "-m", "app.worker"]
    environment: *backend_environment
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
